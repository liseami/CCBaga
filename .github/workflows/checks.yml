# [INPUT]: pull_request 提交、锁定依赖与 docs/linux.md 的 Ubuntu 依赖清单。
# [OUTPUT]: Ubuntu x86_64 上的前端、原生与 Skill 检查结果；不产生产物。
# [POS]: PR 只读检查入口；无 Secrets、无签名、无产物上传，不接触 release.yml 发布流程。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
# Workflow name shown on pull requests
name: Checks
# Run only for pull requests
on:
  # Every pull request event uses the default types (opened, synchronize, reopened)
  pull_request:
# Read-only token: the workflow never writes to the repository
permissions:
  # Checkout needs read access only
  contents: read
# Cancel superseded runs for the same pull request
concurrency:
  # One group per pull request number
  group: checks-${{ github.event.pull_request.number }}
  # A newer push replaces the running check
  cancel-in-progress: true
# Jobs in this workflow
jobs:
  # Ubuntu checks listed in README "Checks" and docs/linux.md
  ubuntu:
    # Same runner image as the release Linux job
    runs-on: ubuntu-24.04
    # Fail instead of hanging on a stuck step
    timeout-minutes: 60
    # Steps run in order
    steps:
      # Check out the pull request without persisting the token
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # Checkout options
        with:
          # Keep the token out of the local git config
          persist-credentials: false
      # Node version pinned to match release.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        # Node options
        with:
          # Same Node version as release.yml
          node-version: '22.23.2'
          # No package-manager cache, matching release.yml
          package-manager-cache: false
      # Bun version pinned to match release.yml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # Bun options
        with:
          # Same Bun version as release.yml
          bun-version: 1.3.5
      # Python version pinned to match release.yml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        # Python options
        with:
          # Same Python version as release.yml
          python-version: '3.13'
      # Install Ubuntu dependencies and the locked toolchain
      - name: Prepare Linux tools
        # Shell commands for this step
        run: |
          # Linux checks target x86_64 only
          test "$(uname -m)" = x86_64
          # Refresh the apt package index
          sudo apt-get update
          # Ubuntu 24.04 dependencies from docs/linux.md
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf curl zsh openssh-client xdg-utils wl-clipboard xclip libnss3 libnspr4 libgbm1 libasound2t64 libxss1
          # Same Rust toolchain as release.yml
          rustup toolchain install 1.98.1 --profile minimal
          # Use that toolchain for cargo
          rustup default 1.98.1
          # Install frontend dependencies from the lockfile only
          bun install --frozen-lockfile
      # Cache compiled Rust dependencies only; no build outputs are uploaded
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        # Cache options
        with:
          # Cache the src-tauri target directory
          workspaces: src-tauri -> target
          # Separate key from the release Linux cache
          shared-key: checks-ubuntu24
      # Frontend unit tests
      - name: Frontend tests
        # Run bun's test runner
        run: bun test
      # Type check and build the frontend; Tauri embeds dist/ during cargo test
      - name: Frontend build
        # Runs tsc --noEmit and vite build
        run: bun run build
      # Native Rust tests on Linux
      - name: Rust tests
        # Locked dependencies, matching release.yml
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # Offline Network Skill tests
      - name: Network Skill tests
        # Uses local fixtures and OpenSSH from the runner
        run: python3 skills/ccbaga-network/scripts/test_network.py
      # Shell syntax check for the VPS setup script
      - name: VPS script syntax
        # Parse only; nothing is executed
        run: bash -n skills/ccbaga-network/scripts/setup-vps.sh
