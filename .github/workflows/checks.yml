# [INPUT]: PR 合并提交或 main 源码、三平台（macOS 双架构）工具与引擎准备离线样本。
# [OUTPUT]: 前端/原生/Skill、发布装配与平台回归结果，不交付安装包。
# [POS]: 无凭据 PR/main 检查；不签名、不发布、不下载引擎，独立于 release.yml。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  # PR 淘汰旧检查；main 让在途检查完成并保存原生缓存，避免 UI 迭代反复冷编译。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Checks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu
            runner: ubuntu-22.04
          - platform: macOS
            runner: macos-15
          - platform: macOS-Intel
            runner: macos-15-intel
          - platform: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      # 原生回归只使用公开静态资源；真实引擎/安装包仍由 release 验收。
      TAURI_CONFIG: '{"bundle":{"resources":["../dist/","../browser-runtime/version.txt","../browser-runtime/LICENSE.fingerprint-chromium"]}}'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Browser preparation regression
        run: python scripts/test-fetch-browser.py
      - name: Intel engine build boundaries (offline)
        run: |
          python scripts/test-macos-intel-engine.py
          python scripts/test-macos-packaging.py
      - name: Prepare Ubuntu tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev curl zsh openssh-client xdg-utils wl-clipboard xclip rpm libarchive-tools
      - name: Prepare Windows OpenSSH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path "$env:SystemRoot\System32\OpenSSH\ssh.exe")) {
            Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0 | Out-Null
          }
      - name: Prepare locked dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          # 系统镜像版本也属于 ABI 边界，禁止跨 Ubuntu 基线恢复编译缓存。
          shared-key: checks-${{ matrix.platform }}-${{ matrix.runner }}
          cache-on-failure: true
      - name: Frontend tests
        run: bun test
      - name: Frontend build
        run: bun run build
      - name: Browser UI resource references
        run: python scripts/browser_ui.py dist
      - name: Skill npm installation
        run: bun scripts/test-skill-install.ts
      - name: Network Skill offline tests
        run: python skills/ccbaga-network/scripts/test_network.py
      - name: Release assembly offline tests
        run: python scripts/test-assemble-release.py
      - name: Script syntax
        run: bash -n skills/ccbaga-network/scripts/setup-vps.sh
      - name: Native CLI zsh syntax
        if: runner.os != 'Windows'
        run: zsh -n scripts/claude-cli.sh
      - name: Rust native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - name: Linux installation and RPM regression
        if: runner.os == 'Linux'
        run: |
          python scripts/test-linux.py
          python scripts/test-package-linux-browser.py
          python scripts/test-rpm.py
      - name: macOS signing and installation boundaries
        if: runner.os == 'macOS'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/release-requirements.txt
          python scripts/test-sign-browser.py
          python scripts/test-release-env.py
          python scripts/test-install-apps.py
          clang -fobjc-arc -framework Foundation -framework Security src-tauri/native/IdentityTests.m -o "$RUNNER_TEMP/ccbaga-identity-test"
          "$RUNNER_TEMP/ccbaga-identity-test"
          rm -f "$RUNNER_TEMP/ccbaga-identity-test"
      - name: Windows CLI and region regression
        if: runner.os == 'Windows'
        run: python scripts/test-windows.py
